services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/data/uploads
    environment:
      DATABASE_URL: sqlite:///./vertrags_ocr.db
      UPLOAD_DIR: ./data/uploads
      OCR_BACKEND: mock
      FRONTEND_ORIGIN: http://localhost:5173
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  uploads:

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertrags-OCR Review</title>
    <link rel="stylesheet" href="/dist/index.css" />
    <link rel="stylesheet" href="/dist/App.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Von scripts/build.mjs generiert (Default: http://localhost:8000,
         überschreibbar per API_BASE_URL-Env-Var) - als externe Datei statt
         Inline-Script, damit script-src in der Content-Security-Policy ohne
         'unsafe-inline' auskommt (siehe scripts/dev-server.mjs). -->
    <script src="/dist/app-config.js"></script>
    <script type="importmap">
      {
        "imports": {
          "pdfjs-dist": "/node_modules/pdfjs-dist/build/pdf.mjs"
        }
      }
    </script>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
